<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Role Map</title><desc id="desc">Roles contribute, validate, approve and operate through one evidence model.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity=".12"/></filter>
  <style>.bg{fill:#f4f7fa}.title{font:700 34px Arial;fill:#08264a}.sub{font:16px Arial;fill:#506779}.box{fill:#fff;stroke:#cfd9e2;stroke-width:2;filter:url(#s)}.navy{fill:#08264a}.gold{fill:#c3912f}.teal{fill:#2b6f72}.h{font:700 17px Arial;fill:#08264a}.w{font:700 16px Arial;fill:#fff}.p{font:14px Arial;fill:#506779}.line{stroke:#8fa4b5;stroke-width:3;fill:none;marker-end:url(#a)}.thin{stroke:#b9c7d2;stroke-width:2;fill:none}</style>
  <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa4b5"/></marker></defs>
  <rect class="bg" width="1400" height="820"/><text class="title" x="60" y="58">Enterprise Role Map</text><text class="sub" x="60" y="88">Roles contribute, validate, approve and operate through one evidence model.</text><rect class="navy" x="55" y="130" width="300" height="125" rx="12"/><text class="w" x="71" y="158">Executive Sponsor</text><text class="w" x="71" y="181">0, 3, 6, 11, 13</text><rect class="navy" x="390" y="130" width="300" height="125" rx="12"/><text class="w" x="406" y="158">Platform Owner</text><text class="w" x="406" y="181">All stages</text><rect class="box" x="725" y="130" width="300" height="125" rx="12"/><text class="h" x="741" y="158">Programme Director</text><text class="p" x="741" y="181">0-11</text><rect class="box" x="1060" y="130" width="300" height="125" rx="12"/><text class="h" x="1076" y="158">Business Owner</text><text class="p" x="1076" y="181">0, 1, 3, 5, 6, 10-13</text><rect class="box" x="55" y="325" width="300" height="125" rx="12"/><text class="h" x="71" y="353">Enterprise Architect</text><text class="p" x="71" y="376">1-10, 12-13</text><rect class="box" x="390" y="325" width="300" height="125" rx="12"/><text class="h" x="406" y="353">Data Owner</text><text class="p" x="406" y="376">1-13</text><rect class="box" x="725" y="325" width="300" height="125" rx="12"/><text class="h" x="741" y="353">Security Lead</text><text class="p" x="741" y="376">1-12</text><rect class="box" x="1060" y="325" width="300" height="125" rx="12"/><text class="h" x="1076" y="353">Privacy and Legal Leads</text><text class="p" x="1076" y="376">1-12</text><rect class="box" x="55" y="520" width="300" height="125" rx="12"/><text class="h" x="71" y="548">Engineering Lead</text><text class="p" x="71" y="571">7-11</text><rect class="box" x="390" y="520" width="300" height="125" rx="12"/><text class="h" x="406" y="548">Service Owner</text><text class="p" x="406" y="571">8-13</text><rect class="box" x="725" y="520" width="300" height="125" rx="12"/><text class="h" x="741" y="548">Audit and Assurance Lead</text><text class="p" x="741" y="571">4, 10, 12-13</text><circle cx="700" cy="690" r="65" class="teal"/><text class="w" x="638" y="684">Evidence and</text><text class="w" x="636" y="707">decision model</text></svg>