<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">Intent-Aware Search Blueprint</title><desc id="desc">Questions resolve to journey intent, evidence and next actions.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity=".12"/></filter>
  <style>.bg{fill:#f4f7fa}.title{font:700 34px Arial;fill:#08264a}.sub{font:16px Arial;fill:#506779}.box{fill:#fff;stroke:#cfd9e2;stroke-width:2;filter:url(#s)}.navy{fill:#08264a}.gold{fill:#c3912f}.teal{fill:#2b6f72}.h{font:700 17px Arial;fill:#08264a}.w{font:700 16px Arial;fill:#fff}.p{font:14px Arial;fill:#506779}.line{stroke:#8fa4b5;stroke-width:3;fill:none;marker-end:url(#a)}.thin{stroke:#b9c7d2;stroke-width:2;fill:none}</style>
  <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa4b5"/></marker></defs>
  <rect class="bg" width="1400" height="680"/><text class="title" x="60" y="58">Intent-Aware Search Blueprint</text><text class="sub" x="60" y="88">Questions resolve to journey intent, evidence and next actions.</text><rect class="teal" x="40" y="250" width="145" height="100" rx="12"/><text class="w" x="56" y="278">Question</text><path class="line" d="M185 300H204"/><rect class="box" x="208" y="250" width="145" height="100" rx="12"/><text class="h" x="224" y="278">Intent + Persona</text><path class="line" d="M353 300H372"/><rect class="box" x="376" y="250" width="145" height="100" rx="12"/><text class="h" x="392" y="278">Stage + Capability</text><path class="line" d="M521 300H540"/><rect class="box" x="544" y="250" width="145" height="100" rx="12"/><text class="h" x="560" y="278">Access + Version</text><path class="line" d="M689 300H708"/><rect class="box" x="712" y="250" width="145" height="100" rx="12"/><text class="h" x="728" y="278">Hybrid Retrieval</text><path class="line" d="M857 300H876"/><rect class="box" x="880" y="250" width="145" height="100" rx="12"/><text class="h" x="896" y="278">Evidence Reranking</text><path class="line" d="M1025 300H1044"/><rect class="teal" x="1048" y="250" width="145" height="100" rx="12"/><text class="w" x="1064" y="278">Grounded Answer</text><text class="w" x="1064" y="301">Sources + gaps</text><path class="line" d="M1193 300H1212"/><rect class="box" x="1216" y="250" width="145" height="100" rx="12"/><text class="h" x="1232" y="278">Next Actions</text><rect class="navy" x="430" y="500" width="540" height="100" rx="12"/><text class="w" x="446" y="528">Example: “I want to start AI”</text><text class="w" x="446" y="551">Mobilise → Charter → Drivers → Stakeholders → Workshops</text></svg>