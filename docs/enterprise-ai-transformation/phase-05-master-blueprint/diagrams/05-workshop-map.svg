<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Workshop Map</title><desc id="desc">Workshops produce evidence and decisions at lifecycle transitions.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity=".12"/></filter>
  <style>.bg{fill:#f4f7fa}.title{font:700 34px Arial;fill:#08264a}.sub{font:16px Arial;fill:#506779}.box{fill:#fff;stroke:#cfd9e2;stroke-width:2;filter:url(#s)}.navy{fill:#08264a}.gold{fill:#c3912f}.teal{fill:#2b6f72}.h{font:700 17px Arial;fill:#08264a}.w{font:700 16px Arial;fill:#fff}.p{font:14px Arial;fill:#506779}.line{stroke:#8fa4b5;stroke-width:3;fill:none;marker-end:url(#a)}.thin{stroke:#b9c7d2;stroke-width:2;fill:none}</style>
  <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa4b5"/></marker></defs>
  <rect class="bg" width="1400" height="720"/><text class="title" x="60" y="58">Enterprise Workshop Map</text><text class="sub" x="60" y="88">Workshops produce evidence and decisions at lifecycle transitions.</text><rect class="teal" x="60" y="135" width="235" height="140" rx="12"/><text class="w" x="76" y="163">Executive ambition and mandate</text><text class="w" x="76" y="186">3 hours • Mandate and draft charter</text><rect class="box" x="328" y="135" width="235" height="140" rx="12"/><text class="h" x="344" y="163">Stakeholder and governance design</text><text class="p" x="344" y="186">4 hours • Stakeholder register; RACI; forum map</text><rect class="box" x="596" y="135" width="235" height="140" rx="12"/><text class="h" x="612" y="163">Enterprise discovery</text><text class="p" x="612" y="186">1 day • Discovery plan and evidence requests</text><rect class="box" x="864" y="135" width="235" height="140" rx="12"/><text class="h" x="880" y="163">Readiness calibration</text><text class="p" x="880" y="186">4 hours • Approved readiness assessment</text><rect class="box" x="1132" y="135" width="235" height="140" rx="12"/><text class="h" x="1148" y="163">Strategy choices</text><text class="p" x="1148" y="186">1 day • Strategy decision pack</text><rect class="box" x="60" y="395" width="235" height="140" rx="12"/><text class="h" x="76" y="423">Governance and risk design</text><text class="p" x="76" y="446">1 day • Governance framework</text><rect class="box" x="328" y="395" width="235" height="140" rx="12"/><text class="h" x="344" y="423">Opportunity portfolio</text><text class="p" x="344" y="446">1 day • Prioritised portfolio</text><rect class="box" x="596" y="395" width="235" height="140" rx="12"/><text class="h" x="612" y="423">Architecture decisions</text><text class="p" x="612" y="446">1-2 days • Architecture decision pack</text><rect class="box" x="864" y="395" width="235" height="140" rx="12"/><text class="h" x="880" y="423">Production readiness</text><text class="p" x="880" y="446">4 hours • Gate decision and conditions</text><rect class="teal" x="1132" y="395" width="235" height="140" rx="12"/><text class="w" x="1148" y="423">Benefits and scale review</text><text class="w" x="1148" y="446">4 hours • Benefits and scale decision</text></svg>